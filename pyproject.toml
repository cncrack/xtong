[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xxt"
version = "0.1.0"
description = "网课自动化学习助手（超星学习通适配）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.40",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
xxt = "xxt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
