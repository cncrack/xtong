[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xxt"
version = "0.1.0"
description = "网课自动化学习助手（超星学习通适配）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.40",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "cryptography>=42",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
xxt = "xxt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"xxt.adapters.chaoxing" = ["watcher.js"]

[tool.pytest.ini_options]
# 只收 tests/：data/debug/ 下是现场诊断脚本（会真访问面板/平台），
# 被 pytest 递归收集时会在 import 阶段报错，把 push_check 门禁弄挂（2026-10-26 踩过）。
testpaths = ["tests"]
