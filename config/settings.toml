# XXT 配置。敏感信息（API Key、密码）一律放环境变量，不写在这里。

[app]
# 数据目录（相对项目根）：数据库、账号会话、日志都放这里
data_dir = "data"

[platform]
# 第二平台（2026-10-30 切换）：本工作树只跑新站，超星配置留在 E:\xxt。
# 平台常量以 `adapters/gxks/selectors.py` 为准，这里的地址仅作标识与展示。
name = "gxks"
login_url = "http://www.gaoxiaokaoshi.com/Default.aspx"
space_url = "http://www.gaoxiaokaoshi.com/MainPage.aspx"

[panel]
# 第二平台独立面板。超星是 8300，两边互不交叉（用户 2026-10-30 定）。
host = "127.0.0.1"
port = 8301

[gxks]
# 练习作答策略：
#   ai        = AI 回填进页面（不提交），人工核对后自己点交卷——默认
#   reference = 只在面板列出参考答案，不动页面
#   owner     = 号主自理，只给操作指引
work_mode = "ai"
# 自动交卷（默认关）。需等人工核对流程跑熟后由用户手动打开。
# 打开后由后台进程自己处理 confirm/alert 再点交卷。
auto_submit = false
# 仅当账号表（data/accounts.local.json）里查不到该代号时的兜底端口。
# 端口是**账号属性**（一账号一 Chrome 一端口），以账号表为准，见 accounts.resolve_port。
port_base = 9300
# 允许的题型代码（逗号分隔）。目前实测只有单选=2；未实测题型一律拒收，
# 宁可停止也不猜——新增题型实测通过后再往这里加。
allowed_types = "2"

[llm]
# OpenAI 兼容接口，换厂商只改 base_url 和 model。
# API Key 从环境变量 XXT_LLM_API_KEY 读取，不落盘。
provider = "agnes"
base_url = "https://api.agnes-ai.cn/v1"
model = "agnes-2.5-flash"

[learn]
# 播放倍速：不要超过 1.25，高倍速是平台风控重点（实际值在 [pace].speed_range 内随机）。
speed = 1.0
# 每账号每日学习时长上限（分钟），0 = 不限制。
daily_max_minutes = 240
# 节级尝试次数（2026-10-27 配置化，以前这三个是代码里的魔法数字）：
# 单节点开最多点几次（每次点完等任务页 15 秒），1~5
enter_retries = 2
# 连续几节都打不开就收工，1~10（打不开的节保持“待学”，不会被永久跳过）
max_skip_chapters = 3
# 连续几个非视频任务点（作业/阅读）算本段结束，1~20
non_video_streak = 4
# 非视频节点关键词（逗号分隔）：名字含这些词的节不会被当成"播放失败"，
# 会话收尾时标 visited（平台改叫法时改这里即可，不用改代码）
non_video_marks = "作业,测验,讨论,阅读,考试,练习,公告"
# 视频中途中断（ended=False）时，重载任务页续播几次（0=关闭，最大 3）
partial_retries = 1
# 已播达到百分之几才值得续播（30~95，默认 60）
partial_retry_ratio_pct = 60
# 每账号每日登录尝试上限（1~5，默认 2）。失败尝试也算次数，因为失败同样是风控信号。
login_budget_per_day = 2

[pace]
# 拟人化节奏（PLAN §5.5）：全部为区间，运行时按分布抽样，代码禁止固定 sleep。
# 切节间隔三档：约 70% 连看 / 20% 短歇 / 10% 离开
gap_browse = [3, 15]
gap_short = [30, 90]
gap_away = [180, 600]
gap_weights = [70, 20, 10]
# 专注会话：连续学习 X 分钟后休息 Y 分钟
focus_minutes = [25, 60]
rest_minutes = [5, 15]
# 学习时段窗口（本地时间），窗口外不学习
daily_window = ["08:00", "23:00"]
# 播放倍速区间（每个视频随机取一次）
speed_range = [1.0, 1.25]

[quota]
# 每日双额度（PLAN v0.6 §5.5/§5.6）：时长与任务数任一达标即停当天学习。
daily_minutes = 240        # 时长额度上限（分钟，0 = 不限）
daily_tasks = 60           # 任务数额度上限（视频个数，0 = 不限）
# 当日实际额度在上限内随机浮动（比例区间），避免每天都精确刷满
float_ratio = [0.7, 1.0]

[rotation]
# 课程轮换（PLAN v0.8）：优先级 × 未完成度 加权随机抽样；P0 一次会话主学 1 门。
courses_per_day = [1, 3]
# 课程优先级：courseid 或课程名 → 权重，默认 1.0（数值越高越优先）
priorities = { "266339100" = 3.0 }

[quiz]
# 弹题 AI 作答（P2 功能，计分项）。默认关闭：P0/P1 阶段弹题按平台默认行为处理。
enabled = false
# semi = AI 只填入建议答案、人工确认后提交；auto = 全自动提交。P2 启用时先 semi 校准正确率。
mode = "semi"
# 章节作业自动作答（P2.5）：semi=只填不交；auto 慎用（同 mode 语义）
work_enabled = false
# 作业策略全局默认（owner 号主自理 / reference AI参考答案 / ai AI代答semi）——账号✎管理里未设时生效
work_mode_default = "owner"

[stealth]
# 刷课执行时是否无头（Q36：2026-10-28 起真正生效，由 core/browser.py 统一读取）。
# 面板「⚙ 全局设置 → ⏱ 守护与节级策略 → ⑥ 浏览器形态」可改，下次启动浏览器生效。
# 关掉后所有刷课/抓课程/作业都会弹出窗口（调试用）；人工登录始终有头，不受此项影响。
headless = true

[auto]
# 守护（xxt auto）的失败处理（2026-10-27）：以前“发起就算今天已完成”，一次秒退
# 就白掉一整天；现在发起只算“尝试”，回读确认会话真在跑才算学过。
# 每号每天最多自动发起几次（0 = 不限）
# 2026-10-27 用户要求可改：原先写死 2，现为配置项（面板⏱设置里也能改）
max_tries = 3
# 失败后隔多少分钟再试（避免连续敲平台触发风控）
retry_minutes = 15
# 退避随机浮动（%）：固定 15/30/60 的等差节奏最像机器人，±这个比例内随机
# （2026-10-27 用户要求“可以设置随机，模拟人的行为”）
retry_jitter_pct = 40
# 退避封顶（分钟）：再糟也不会超过这个间隔
retry_max_minutes = 90
# 单日绝对发起上限（Q19，2026-10-27）：短退避（max_tries）用尽后，可恢复的失败
# （打不开/网络/风控）转长退避继续努力，直到这个轮数才真硬停。
# 额度与任务数是最高优先级，高于重试次数——不要一碰到次数就判“今天收工”。
hard_tries_cap = 4
# 发起后等多少秒再回读“进程是否还活着”
confirm_seconds = 25
